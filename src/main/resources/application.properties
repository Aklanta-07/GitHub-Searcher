spring.application.name=github-searcher

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/github_searcher}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:github_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:github_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=${PORT:8080}
